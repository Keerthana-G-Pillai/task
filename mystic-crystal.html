<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mystic Crystal - Wheel of Destiny</title>

    <link rel="stylesheet" href="mystic-crystal.css">
</head>

<body>

    <section class="mystic-booth">

        <div class="stars"></div>

        <p class="eyebrow">✦ THE MYSTIC CRYSTAL ✦</p>

        <h1>WHEEL OF DESTINY</h1>

        <p class="subtitle">
            Dare to discover what fate has planned for you...
        </p>

        <div class="crystal-wrapper">

            <div class="magic-ring ring-1"></div>
            <div class="magic-ring ring-2"></div>
            <div class="magic-ring ring-3"></div>

            <div class="crystal-ball" id="crystalBall">

                <div class="crystal-inner">

                    <div class="swirl swirl-1"></div>
                    <div class="swirl swirl-2"></div>

                    <div class="crystal-symbol">✦</div>

                    <div class="sparkle sparkle-1">✧</div>
                    <div class="sparkle sparkle-2">✦</div>
                    <div class="sparkle sparkle-3">✧</div>

                </div>

            </div>

            <div class="crystal-base">
                <div class="base-glow"></div>
                <div class="base-top"></div>
                <div class="base-body"></div>
            </div>

        </div>

        <button id="fortuneButton">
            <span>✦ REVEAL YOUR FATE ✦</span>
        </button>

        <div class="prediction" id="prediction">
            <span class="prediction-icon">🔮</span>
            <p id="predictionText">
                The crystal awaits your question...
            </p>
        </div>

    </section>

    <script src="mystic-crystal.js"></script>

</body>
</html>
