<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Photo Gallery Wall</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background: #f2f2f2;
      color: #222;
    }

    header {
      text-align: center;
      padding: 32px 20px 20px;
    }

    header h1 {
      margin: 0 0 8px;
      font-size: 32px;
    }

    header p {
      margin: 0;
      color: #666;
    }

    .gallery {
      width: min(1100px, 92%);
      margin: 20px auto 50px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 24px;
    }

    .photo-card {
      background: white;
      border: 8px solid white;
      border-radius: 4px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.12);
      overflow: hidden;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .photo-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.18);
    }

    .photo-card img {
      display: block;
      width: 100%;
      height: 220px;
      object-fit: cover;
    }

    .caption {
      padding: 14px 10px 12px;
      text-align: center;
      font-size: 16px;
      font-weight: 600;
    }

    @media (max-width: 600px) {
      header h1 {
        font-size: 26px;
      }

      .gallery {
        grid-template-columns: 1fr;
      }

      .photo-card img {
        height: 240px;
      }
    }
  </style>
</head>
<body>

  <header>
    <h1>Photo Gallery</h1>
    <p>A collection of beautiful moments</p>
  </header>

  <main class="gallery">
    <article class="photo-card">
      <img src="https://picsum.photos/id/1015/600/400" alt="Mountain landscape">
      <div class="caption">Mountain Escape</div>
    </article>

    <article class="photo-card">
      <img src="https://picsum.photos/id/1016/600/400" alt="Forest landscape">
      <div class="caption">Forest Adventure</div>
    </article>

    <article class="photo-card">
      <img src="https://picsum.photos/id/1018/600/400" alt="Green mountains">
      <div class="caption">Green Horizons</div>
    </article>

    <article class="photo-card">
      <img src="https://picsum.photos/id/1025/600/400" alt="Dog portrait">
      <div class="caption">Best Friend</div>
    </article>

    <article class="photo-card">
      <img src="https://picsum.photos/id/1035/600/400" alt="Beach landscape">
      <div class="caption">Ocean Breeze</div>
    </article>

    <article class="photo-card">
      <img src="https://picsum.photos/id/1043/600/400" alt="River and mountains">
      <div class="caption">Peaceful Waters</div>
    </article>
  </main>

</body>
</html>
